<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bazaar — online shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#08080c; --surface:#101018; --border:#242436; --green:#00ff66; --amber:#ffb000; --red:#ff2a4b; --cyan:#00e5ff; --purple:#bb66ff; --white:#e2e8f0; --dim:#64748b;
            --pixel:'Press Start 2P', monospace; --body:'VT323','Courier New',monospace; }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--white); font-family:var(--body); font-size:20px; line-height:1.3; padding:12px; min-height:100vh; }
    header { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; border:2px solid var(--cyan); background:var(--surface); padding:10px 14px; margin-bottom:12px; }
    h1 { font-family:var(--pixel); font-size:15px; color:var(--cyan); }
    .tag { color:var(--dim); }
    .sp { flex:1; }
    .who { color:var(--dim); font-size:16px; }
    form.search { display:flex; gap:6px; margin-bottom:12px; }
    input, textarea, select, button { font:inherit; color:var(--white); background:var(--surface); border:1px solid var(--border); padding:6px 10px; }
    input[type=search] { flex:1; min-width:0; }
    button { cursor:pointer; border-color:var(--cyan); color:var(--cyan); }
    button:hover, button:focus-visible { background:rgba(0,229,255,.12); outline:none; }
    button.buy { border-color:var(--green); color:var(--green); }
    button.buy:hover { background:rgba(0,255,102,.12); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; margin-bottom:14px; }
    .card { border:1px solid var(--border); background:var(--surface); padding:10px 12px; display:flex; flex-direction:column; gap:6px; }
    .card h3 { font-size:21px; color:var(--white); font-weight:normal; }
    .card .price { font-family:var(--pixel); font-size:12px; color:var(--amber); }
    .card .stock { color:var(--dim); font-size:16px; }
    .card .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
    .panel { border:1px solid var(--border); background:var(--surface); padding:10px 12px; margin-bottom:12px; }
    .panel h2 { font-family:var(--pixel); font-size:9px; color:var(--cyan); margin-bottom:8px; letter-spacing:1px; }
    #cart .line { display:flex; justify-content:space-between; gap:10px; }
    #note { width:100%; min-height:54px; margin:6px 0; resize:vertical; }
    #status { border:1px solid var(--border); padding:8px 12px; margin-bottom:12px; min-height:40px; }
    #status.ok { border-color:var(--green); color:var(--green); }
    #status.wait { border-color:var(--amber); color:var(--amber); }
    #status.bad { border-color:var(--red); color:var(--red); }
    #status.info { border-color:var(--cyan); color:var(--cyan); }
    label { color:var(--dim); font-size:17px; }
    footer { color:var(--dim); font-size:16px; }
    .empty { color:var(--dim); }
  </style>
</head>
<body>
  <header>
    <h1>THE BAZAAR</h1>
    <span class="tag">tickets, sneakers and gadgets. All prices in rupees.</span>
    <span class="sp"></span>
    <span class="who">visitor <span id="sid" data-testid="session-id"></span></span>
  </header>

  <form class="search" id="searchForm" role="search">
    <input type="search" id="q" data-testid="search-input" placeholder="Search the shelves (concert, sneaker, keyboard...)" aria-label="Search products">
    <button type="submit" data-testid="search-btn">SEARCH</button>
    <button type="button" id="all" data-testid="show-all">SHOW ALL</button>
  </form>

  <div id="status" data-testid="status" class="info" role="status" aria-live="polite">Welcome. Have a look around.</div>

  <div id="grid" data-testid="grid"></div>

  <section class="panel" id="cart" aria-label="Your basket">
    <h2>YOUR BASKET</h2>
    <div id="cartLines" data-testid="cart-lines" class="empty">Empty.</div>
    <label for="note">Note to the seller (optional)</label>
    <textarea id="note" data-testid="note" maxlength="300" placeholder="Anything the seller should know?"></textarea>
    <button class="buy" id="pay" data-testid="pay" disabled>PAY NOW</button>
  </section>

  <footer>Every request goes through the Desk Sergeant (the gateway) before it reaches the shop.</footer>

<script src="/config.js"></script>
<script>
const cfg = window.QUARANTINE || { gateway: 'http://localhost:3001', admin: 'http://localhost:3002' };
const $ = (id) => document.getElementById(id);
const inr = (n) => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// One visitor id per browser profile. Tabs of the same browser share it, like a real shopper's cookie would.
// ?session=... lets a demo pick it.
const params = new URLSearchParams(location.search);
let SID = params.get('session') || null;
try { SID = SID || localStorage.getItem('bazaar-session'); } catch (_) {}
if (!SID) SID = 'shop-' + Math.random().toString(36).slice(2, 10);
try { localStorage.setItem('bazaar-session', SID); } catch (_) {}
$('sid').textContent = SID;

let cart = [];   // [{ id, name, price, qty }]

async function gw(method, path, body) {
  const res = await fetch(cfg.gateway + path, {
    method,
    headers: { 'x-session-id': SID, ...(body ? { 'content-type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let json = null;
  try { json = await res.json(); } catch (_) {}
  return { status: res.status, json };
}

function say(text, cls) { const s = $('status'); s.textContent = text; s.className = cls || 'info'; }

// A page that runs JavaScript announces itself. It also reports a few browser facts: automation frameworks
// (Playwright, Puppeteer, Selenium) set navigator.webdriver, which honest browsers do not.
fetch(cfg.gateway + '/beacon', {
  method: 'POST',
  headers: { 'x-session-id': SID, 'content-type': 'application/json' },
  body: JSON.stringify({ webdriver: navigator.webdriver === true, plugins: (navigator.plugins || []).length, languages: (navigator.languages || []).length }),
}).catch(() => {});

async function load(q) {
  const r = await gw('GET', '/search' + (q ? '?q=' + encodeURIComponent(q) : ''));
  if (r.status === 403) return say('The Desk Sergeant has shut the door on you (403).', 'bad');
  if (r.status === 429) return say('Too many requests. Slow down.', 'bad');
  const items = (r.json && r.json.results) || [];
  $('grid').innerHTML = items.length ? items.map((p) => `
    <div class="card" data-testid="product-${p.id}">
      <h3>${esc(p.name)}</h3>
      <div class="price">${inr(p.price)}</div>
      <div class="stock">${p.stock} in stock${r.json.sandbox ? ' (demo copy)' : ''}</div>
      <div class="row">
        <button data-testid="view-${p.id}" data-act="view" data-id="${p.id}">LOOK</button>
        <button data-testid="add-${p.id}" data-act="add" data-id="${p.id}">ADD</button>
        <button class="buy" data-testid="buy-${p.id}" data-act="buy" data-id="${p.id}">BUY NOW</button>
      </div>
    </div>`).join('') : '<div class="empty">Nothing on the shelves for that.</div>';
  window.__items = Object.fromEntries(items.map((p) => [p.id, p]));
}

function renderCart() {
  $('cartLines').innerHTML = cart.length ? cart.map((c) => `<div class="line"><span>${c.qty} x ${esc(c.name)}</span><span>${inr(c.price * c.qty)}</span></div>`).join('') +
    `<div class="line"><b>Total</b><b data-testid="cart-total">${inr(cart.reduce((a, c) => a + c.price * c.qty, 0))}</b></div>` : 'Empty.';
  $('cartLines').className = cart.length ? '' : 'empty';
  $('pay').disabled = cart.length === 0;
}

async function view(id) {
  const r = await gw('GET', '/product/' + id);
  const p = r.json && r.json.product;
  if (p) say(`${p.name}: ${inr(p.price)}, ${p.stock} in stock.`, 'info');
  return p;
}

async function add(id) {
  const p = (window.__items || {})[id];
  if (!p) return;
  const r = await gw('POST', '/cart', { productId: id, qty: 1 });
  if (r.status >= 400) return say('Could not add that to the basket.', 'bad');
  const line = cart.find((c) => c.id === id);
  if (line) line.qty++; else cart.push({ id, name: p.name, price: p.price, qty: 1 });
  renderCart();
  say(`Added ${p.name} to your basket.`, 'info');
}

// Pays for whatever is in the basket, one checkout per line. A human must approve big payments: we then wait live.
async function pay(lines) {
  const reason = $('note').value.trim();
  $('pay').disabled = true;
  for (const c of lines) {
    const amount = c.price * c.qty;
    say(`Paying ${inr(amount)} for ${c.name}...`, 'wait');
    const r = await gw('POST', '/checkout', { productId: c.id, amount, item: c.name, qty: c.qty, ...(reason ? { reason } : {}) });
    await outcome(r, c, amount);
  }
  cart = cart.filter((c) => !lines.includes(c));
  renderCart();
}

async function outcome(r, c, amount) {
  const j = r.json || {};
  if (r.status === 200 && j.status === 'success') return say(`Bought ${c.qty} x ${c.name} for ${inr(amount)}. Order ${j.orderId}.`, 'ok');
  if (r.status === 402) return say(`Payment of ${inr(amount)} refused: over what this wallet may ever spend.`, 'bad');
  if (r.status === 403) return say('The Desk Sergeant has shut the door on you (403).', 'bad');
  if (r.status === 429) return say('Too many requests. Slow down.', 'bad');
  if (r.status === 202 && j.approvalHash) {
    // Held for a human. Follow the decision live (this is what the Judge clicks on the dashboard).
    say(`Payment of ${inr(amount)} is being held. Waiting for a human to approve it...`, 'wait');
    for (let i = 0; i < 90; i++) {
      await new Promise((res) => setTimeout(res, 1500));
      let d = null;
      try { d = await (await fetch(`${cfg.admin}/approvals/${j.approvalHash}`)).json(); } catch (_) {}
      if (!d) continue;
      if (d.status === 'approved') {
        const ok = d.result && d.result.allowed;
        return say(ok ? `A human approved it. Bought ${c.qty} x ${c.name} for ${inr(amount)}. Order ${d.result.orderId}.` : 'A human approved it, but the purchase did not go through.', ok ? 'ok' : 'bad');
      }
      if (d.status === 'denied') return say(d.by === 'policy' ? `The payment of ${inr(amount)} was cancelled because the door was shut on this visitor. Nothing was charged.` : `A human refused the payment of ${inr(amount)}. Nothing was charged.`, 'bad');
      if (d.status === 'unknown') return say('That payment request expired. Please try again.', 'bad');
    }
    return say('Still waiting for a human to decide.', 'wait');
  }
  say(`Something went wrong (${r.status}).`, 'bad');
}

$('grid').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const id = b.dataset.id, p = (window.__items || {})[id];
  if (b.dataset.act === 'view') view(id);
  else if (b.dataset.act === 'add') add(id);
  else if (b.dataset.act === 'buy' && p) pay([{ id, name: p.name, price: p.price, qty: 1 }]);
});
$('pay').addEventListener('click', () => pay([...cart]));
$('searchForm').addEventListener('submit', (e) => { e.preventDefault(); load($('q').value.trim()); });
$('all').addEventListener('click', () => { $('q').value = ''; load(''); });

load('');
renderCart();
</script>
</body>
</html>
